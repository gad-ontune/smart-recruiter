[alembic]
# sqlalchemy url will be set via environment variable
# This file is used for database migrations

# default target for "alembic revision --autogenerate"
# target_revision = "initial"

# path to the SQLAlchemy engine
# This is set via DATABASE_URL environment variable
# sqlalchemy.url = postgresql+psycopg://smartrecruiter:smartrecruiter@localhost:5433/smartrecruiter?sslmode=require

[postgres]
# PostgreSQL connection parameters
# These are overridden by DATABASE_URL environment variable
# host = localhost
# port = 5432
# user = smartrecruiter
# password = smartrecruiter
# dbname = smartrecruiter

# Logging
log_level = info
